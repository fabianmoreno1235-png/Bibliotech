<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro - Biblioteca Pública</title>

    <link rel="stylesheet" href="Registro.css">

</head>

<body>

    <main class="contenedor registro-contenedor">

        <header class="encabezado">

            <img
                src="Imagen1.png"
                alt="Logo Biblioteca Pública"
                class="logo logo-registro">

            <h1>Formulario de registro de usuario</h1>

            <p>
                Únete a nuestra comunidad y accede a todos
                los recursos y servicios de la biblioteca.
            </p>

        </header>


        <form id="formRegistro" class="formulario">

            <div class="campo">

                <label for="nombre">
                    Primer Nombre 
                </label>
                <input
                    type="text"
                    id="nombre"
                    placeholder="Ingresa tu primer nombre"
                    required>

                <label for="segundoNombre">
                    Segundo Nombre 
                </label>

                <input
                    type="text"
                    id="segundoNombre"
                    placeholder="Ingresa tu segundo nombre"
                    required>
<label for="apellido">
                    Primer Apellido 
                </label>

                <input
                    type="text"
                    id="apellido"
                    placeholder="Ingresa tu primer apellido"
                    required>

                <label for="segundoApellido">
                    Segundo Apellido 
                </label>

                <input
                    type="text"
                    id="segundoApellido"
                    placeholder="Ingresa tu segundo apellido"
                    required>

                
            </div>


            <div class="campo">

                <label for="tipoDocumento">
                    Tipo de documento
                </label>

                <select id="tipoDocumento" required>

                    <option value="">
                        Selecciona el tipo de documento
                    </option>

                    <option value="CC">
                        Cédula de ciudadanía
                    </option>

                    <option value="TI">
                        Tarjeta de identidad
                    </option>

                    <option value="CE">
                        Cédula de extranjería
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="documento">
                    Número de documento
                </label>

                <input
                   type="text"
        id="numeroDocumento"
        name="numeroDocumento"
        placeholder="Ingresa el número de documento"
        inputmode="numeric"
        maxlength="10"
        autocomplete="off">

    <small id="errorDocumento" class="error-campo"></small>


            </div>

            <div class="campo">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="Ingresa tu correo electrónico"
                    required>

            </div>


            <div class="campo">

                <label for="telefono">
                    Número telefónico
                </label>

                <input
                    type="tel"
                    id="telefono"
                    placeholder="Ingresa tu número telefónico">

            </div>


            <div class="campo">

                <label for="nuevoUsuario">
                    Nombre de usuario
                </label>

                <input
                    type="text"
                    id="nuevoUsuario"
                    placeholder="Crea un nombre de usuario"
                    required>

            </div>


            <div class="campo">

                <label for="nuevaContrasena">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="nuevaContrasena"
                    placeholder="Crea una contraseña"
                    required>

            </div>


            <div class="campo">

                <label for="confirmarContrasena">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirmarContrasena"
                    placeholder="Confirma tu contraseña"
                    required>

            </div>


            <label class="politica">

                <input
                    type="checkbox"
                    id="politica"
                    required>

                Acepto la política de tratamiento
                de datos personales.

            </label>


            <div class="botones-formulario">

                <button
                   type="button"
        class="btn-cancelar"
        onclick="window.location.href='index.html';">
        Cancelar

                   

                </button>


                <button
                    type="submit"
                    class="btn-principal">

                    👤 Registrarse

                </button>

            </div>

        </form>

    </main>


    <script src="Registro.js"></script>

</body>

</html>
